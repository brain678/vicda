<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoCDA - Access Code Generator</title>
  <script src="/vendor/qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f766e, #164e63);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 440px;
      width: 90%;
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .code-box {
      background: white;
      color: #0f766e;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: 12px;
      padding: 25px 40px;
      border-radius: 16px;
      margin: 25px auto;
      width: fit-content;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      user-select: all;
    }

    /* Form and input styles */
    .form-row label { display:block; font-weight:600; margin-bottom:8px; }
    .form-row input[type="text"] {
      width:100%;
      padding:12px 14px;
      border-radius:10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: white;
      margin-bottom:12px;
      box-sizing: border-box;
      transition: box-shadow .15s, border-color .15s, background .15s;
    }
    .form-row input[type="text"]:focus{
      outline: none;
      border-color: rgba(255,255,255,0.28);
      box-shadow: 0 4px 18px rgba(15,118,110,0.12);
      background: rgba(255,255,255,0.12);
      color: #012724;
    }

    /* Tidy generator button */
    #generateBtn {
      width:100%;
      padding:14px 18px;
      font-size:1.05rem;
      border-radius:12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    }
    #generateBtn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }

    /* subtle container adjustments */
    .container { max-width:520px; padding:36px; }

    /* smaller code box on narrow screens */
    @media (max-width:420px){
      .code-box{ font-size:2.4rem; letter-spacing:8px; padding:18px 28px; }
      #qrcode { width:200px; height:200px; }
    }

    #qrContainer {
      margin: 25px 0;
      text-align: center;
      display: none; /* hidden until a QR is generated */
    }

    /* QR code styling */
    #qrcode {
      width: 260px;
      height: 260px;
      margin: 0 auto;
      padding: 12px;
      background: white;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    #qrcode img, #qrcode table {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      border-radius: 8px;
    }

    #timer {
      font-size: 1.15rem;
      font-weight: 500;
      color: #fbbf24;
      margin: 15px 0;
    }

    .btn {
      background: #f59e0b;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: #d97706;
      transform: translateY(-3px);
    }

    .note {
      margin-top: 30px;
      font-size: 0.95rem;
      opacity: 0.85;
      line-height: 1.5;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">VICDA</div>
    <p class="subtitle">Vision Community Development Association</p>
    
    
    <div style="margin-top:18px; text-align:left;">
      <label for="nameInput" style="display:block; font-weight:600; margin-bottom:6px;">Full Name</label>
      <input id="nameInput" type="text" placeholder="e.g. John Doe" style="width:100%; padding:12px; border-radius:8px; border:none; margin-bottom:10px;">

      <label for="streetInput" style="display:block; font-weight:600; margin-bottom:6px;">Street Name</label>
      <input id="streetInput" type="text" placeholder="e.g. Maple Avenue" style="width:100%; padding:12px; border-radius:8px; border:none;">
    </div>

    <h2 style="margin-top:18px;">Access Code</h2>

    <div id="code" class="code-box">000000</div>

    <div id="qrContainer">
      <div id="qrcode" style="max-width:100%; height:auto;"></div>
      <div style="margin-top:12px;">
        <button id="downloadBtn" class="btn" style="background:#10b981; display:none; padding:10px 18px; font-size:0.95rem; border-radius:10px;">Download QR</button>
      </div>
    </div>

    <div id="timer">Expires in: --:--:--</div>

    <button class="btn" id="generateBtn" onclick="generateNewCode()" disabled>Generate New Code</button>

    <p class="note">
      This code is valid for <strong>3 hours</strong>.<br>
      Share the code or let members scan the QR code.
    </p>

    <div class="footer">
      &copy; 2026 Vision Community Development Association<br>
      Lagos, Nigeria
    </div>
  </div>

  <script>
    let currentCode = null;
    let expiryTime = null;
    let timerInterval = null;

    function showError(message) {
      document.getElementById('timer').innerHTML =
        `<span style="color:#f87171; font-weight:600;">${message}</span>`;
    }

    async function generateNewCode() {
      const name = document.getElementById('nameInput').value.trim();
      const street = document.getElementById('streetInput').value.trim();

      try {
        const response = await fetch('/api/code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, street })
        });

        if (!response.ok) {
          throw new Error('Failed to generate code');
        }

        const data = await response.json();
        currentCode = data.code;
        expiryTime = data.expiresAt;

        // Display the code
        document.getElementById('code').textContent = currentCode;

        // Generate QR Code using qrcode.min.js (creates inside a div)
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, {
          text: currentCode,
          width: 240,
          height: 240,
          colorDark: "#0f766e",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
        // show QR container now that QR has been generated
        document.getElementById('qrContainer').style.display = 'block';
        // show download button
        const dlBtn = document.getElementById('downloadBtn');
        if (dlBtn) dlBtn.style.display = 'inline-block';

        startExpiryTimer();
      } catch (error) {
        document.getElementById('code').textContent = '------';
        showError('Server unavailable. Please try again.');
        // hide QR container on error
        document.getElementById('qrContainer').style.display = 'none';
        const dlBtn = document.getElementById('downloadBtn');
        if (dlBtn) dlBtn.style.display = 'none';
      }
    }

    function downloadQRCode() {
      const qrContainer = document.getElementById('qrcode');
      if (!qrContainer) return;

      // prefer img (data URL) if present
      const img = qrContainer.querySelector('img');
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = `VICDA-${currentCode || 'code'}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        return;
      }

      // fallback to canvas
      const canvas = qrContainer.querySelector('canvas');
      if (canvas) {
        const dataUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `VICDA-${currentCode || 'code'}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      }
    }

    function startExpiryTimer() {
      if (!expiryTime) {
        showError('No active code.');
        const dlBtn = document.getElementById('downloadBtn');
        if (dlBtn) dlBtn.style.display = 'none';
        return;
      }

      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        const remaining = Math.max(0, expiryTime - Date.now());

        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer').innerHTML = 
            '<span style="color:#f87171; font-weight:600;">Code has Expired</span>';
          // hide QR when expired
          const qrC = document.getElementById('qrContainer');
          if (qrC) qrC.style.display = 'none';
          const dlBtn = document.getElementById('downloadBtn');
          if (dlBtn) dlBtn.style.display = 'none';
          return;
        }

        const hours = Math.floor(remaining / (1000 * 60 * 60));
        const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((remaining % (1000 * 60)) / 1000);

        document.getElementById('timer').textContent = 
          `Expires in: ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Generate first code when page loads
    window.onload = () => {
      const nameInput = document.getElementById('nameInput');
      const streetInput = document.getElementById('streetInput');
      const genBtn = document.getElementById('generateBtn');
      const dlBtn = document.getElementById('downloadBtn');

      if (dlBtn) dlBtn.addEventListener('click', downloadQRCode);

      function updateButtonState() {
        genBtn.disabled = !(nameInput.value.trim().length > 0 && streetInput.value.trim().length > 0);
      }

      nameInput.addEventListener('input', updateButtonState);
      streetInput.addEventListener('input', updateButtonState);

      updateButtonState();
    };
  </script>
</body>
</html>
